allowBuilds:
  esbuild: true
  electron: true

packages:
  - packages/*
  - apps/*
minimumReleaseAge: 1440

# patched versions of transitive packages (pnpm audit): the packages that pull them in have not moved yet
overrides:
  nanoid: '>=3.3.18'
  postcss: '>=8.5.23'
  picomatch: '>=2.3.2'
  source-map-js: '>=1.2.2'
  browserslist: '>=4.28.7'
  yaml: '>=2.8.3'
  form-data: '>=4.0.6'
  js-yaml: '>=4.3.2'
  lodash: '>=4.18.0'
  undici: '>=7.30.1'
  fast-uri: '>=3.1.9'
  postcss-selector-parser: '>=6.1.5'
  '@remix-run/router': '>=1.23.3'
  tinypool: '>=2.1.2'
